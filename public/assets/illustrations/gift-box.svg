<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="100%" height="100%">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9ebb"/>
      <stop offset="50%" stop-color="#ff758f"/>
      <stop offset="100%" stop-color="#c9184a"/>
    </linearGradient>
    <linearGradient id="lidGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb3c6"/>
      <stop offset="100%" stop-color="#ff8fab"/>
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe6a7"/>
      <stop offset="50%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#e9a200"/>
    </linearGradient>
    <filter id="giftShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#590d22" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="140" cy="245" rx="90" ry="16" fill="#4a1525" opacity="0.15"/>

  <!-- Gift Box Group -->
  <g filter="url(#giftShadow)">
    <!-- Box Body -->
    <rect x="55" y="115" width="170" height="120" rx="14" fill="url(#boxGrad)"/>

    <!-- Subtle Polka Dots on Box -->
    <circle cx="80" cy="145" r="4" fill="#ffffff" opacity="0.35"/>
    <circle cx="120" cy="165" r="3.5" fill="#ffffff" opacity="0.35"/>
    <circle cx="95" cy="195" r="4" fill="#ffffff" opacity="0.35"/>
    <circle cx="160" cy="145" r="3.5" fill="#ffffff" opacity="0.35"/>
    <circle cx="195" cy="165" r="4" fill="#ffffff" opacity="0.35"/>
    <circle cx="180" cy="205" r="3" fill="#ffffff" opacity="0.35"/>

    <!-- Vertical Ribbon -->
    <rect x="124" y="115" width="32" height="120" fill="url(#ribbonGrad)"/>
    <line x1="124" y1="115" x2="124" y2="235" stroke="#f6bd60" stroke-width="1.5" opacity="0.8"/>
    <line x1="156" y1="115" x2="156" y2="235" stroke="#e09f3e" stroke-width="1.5" opacity="0.8"/>

    <!-- Box Lid -->
    <rect x="45" y="90" width="190" height="35" rx="10" fill="url(#lidGrad)"/>
    <!-- Lid Ribbon -->
    <rect x="124" y="90" width="32" height="35" fill="url(#ribbonGrad)"/>

    <!-- Ribbon Bow Top Loops -->
    <!-- Left loop -->
    <path d="M 140,92 C 110,50 65,55 75,80 C 85,98 125,92 140,92 Z" fill="url(#ribbonGrad)"/>
    <path d="M 132,88 C 115,62 85,66 90,80 C 95,90 120,88 132,88 Z" fill="#e9a200" opacity="0.4"/>

    <!-- Right loop -->
    <path d="M 140,92 C 170,50 215,55 205,80 C 195,98 155,92 140,92 Z" fill="url(#ribbonGrad)"/>
    <path d="M 148,88 C 165,62 195,66 190,80 C 185,90 160,88 148,88 Z" fill="#e9a200" opacity="0.4"/>

    <!-- Ribbon Knot -->
    <ellipse cx="140" cy="92" rx="15" ry="12" fill="#ffd166"/>
    <ellipse cx="140" cy="92" rx="11" ry="8" fill="#ffe6a7"/>

    <!-- Ribbon Hanging Tails -->
    <path d="M 132,96 C 120,115 105,130 95,145 L 110,146 C 120,132 132,118 138,100 Z" fill="url(#ribbonGrad)"/>
    <path d="M 148,96 C 160,115 175,130 185,145 L 170,146 C 160,132 148,118 142,100 Z" fill="url(#ribbonGrad)"/>

    <!-- Little Gift Tag -->
    <g transform="translate(165, 118) rotate(15)">
      <polygon points="0,0 35,0 42,12 35,24 0,24" fill="#fffcf2" stroke="#ffccd5" stroke-width="1.5"/>
      <circle cx="8" cy="12" r="3" fill="#ff758f"/>
      <text x="22" y="16" font-family="'Caveat', cursive, sans-serif" font-size="12" font-weight="bold" fill="#c9184a" text-anchor="middle">For Anifa ♡</text>
    </g>
  </g>

  <!-- Sparkles -->
  <g fill="#ffd166">
    <path d="M 35,80 Q 45,80 45,70 Q 45,80 55,80 Q 45,80 45,90 Q 45,80 35,80 Z"/>
    <path d="M 230,65 Q 240,65 240,55 Q 240,65 250,65 Q 240,65 240,75 Q 240,65 230,65 Z"/>
    <circle cx="50" cy="180" r="3.5" fill="#ff758f"/>
    <circle cx="240" cy="170" r="4" fill="#ffd166"/>
    <circle cx="215" cy="210" r="3" fill="#ff758f"/>
  </g>
</svg>
