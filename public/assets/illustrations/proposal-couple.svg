<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 260" width="100%" height="100%">
  <defs>
    <filter id="coupleShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#4a1525" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="hairBrunette" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a2810"/>
      <stop offset="100%" stop-color="#2a1408"/>
    </linearGradient>
    <linearGradient id="hairBlonde" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f6bd60"/>
      <stop offset="100%" stop-color="#e07a5f"/>
    </linearGradient>
    <linearGradient id="dressKneeling" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8338ec"/>
      <stop offset="100%" stop-color="#3a86ff"/>
    </linearGradient>
    <linearGradient id="dressStanding" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff758f"/>
      <stop offset="100%" stop-color="#ff4d6d"/>
    </linearGradient>
    <linearGradient id="ringGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe6a7"/>
      <stop offset="50%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#e09f3e"/>
    </linearGradient>
  </defs>

  <!-- Ground Shadows -->
  <ellipse cx="105" cy="245" rx="55" ry="10" fill="#2b1b22" opacity="0.12"/>
  <ellipse cx="235" cy="245" rx="45" ry="10" fill="#2b1b22" opacity="0.12"/>

  <!-- Character 1: Kneeling Bestie (Proposer, dramatic stance) -->
  <g filter="url(#coupleShadow)">
    <!-- Kneeling Leg / Body Base -->
    <path d="M 70,210 C 70,230 115,245 140,240 C 145,230 135,215 125,210 Z" fill="#2a1408" opacity="0.8"/>
    <!-- Shoe -->
    <ellipse cx="65" cy="235" rx="14" ry="7" fill="#ff758f"/>
    <ellipse cx="145" cy="240" rx="12" ry="6" fill="#ff758f"/>

    <!-- Dress / Outfit -->
    <path d="M 85,150 L 135,160 L 145,225 L 75,225 Z" fill="url(#dressKneeling)"/>

    <!-- Head & Hair Back -->
    <circle cx="100" cy="110" r="32" fill="#ffe0bd"/>
    <!-- Hair bun / ponytail -->
    <circle cx="70" cy="95" r="16" fill="url(#hairBrunette)"/>
    <path d="M 72,82 C 85,75 125,80 132,105 C 132,105 125,120 120,110 C 110,95 85,90 75,100 Z" fill="url(#hairBrunette)"/>

    <!-- Face Details -->
    <!-- Playful confident wink -->
    <path d="M 108,105 Q 116,98 124,106" stroke="#2a1408" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Eye (open with sparkle) -->
    <circle cx="95" cy="105" r="4" fill="#2a1408"/>
    <circle cx="94" cy="103" r="1.5" fill="#ffffff"/>
    <!-- Cheek Blush -->
    <ellipse cx="118" cy="116" rx="7" ry="4" fill="#ff758f" opacity="0.6"/>
    <!-- Smug Smile -->
    <path d="M 106,120 Q 115,128 122,118" stroke="#c9184a" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Arm extending forward with Ring Box -->
    <path d="M 115,160 C 140,160 165,150 175,145" stroke="#ffe0bd" stroke-width="12" stroke-linecap="round" fill="none"/>

    <!-- Ring Box & Giant Diamond Ring -->
    <g transform="translate(178, 130)">
      <!-- Velvet Box -->
      <rect x="0" y="8" width="24" height="20" rx="4" fill="#590d22"/>
      <path d="M 0,8 Q 12,-4 24,8 Z" fill="#800f2f"/>
      <!-- Ring inside -->
      <ellipse cx="12" cy="8" rx="8" ry="4" fill="url(#ringGold)"/>
      <ellipse cx="12" cy="8" rx="5" ry="2.5" fill="#590d22"/>
      <!-- Giant Sparkling Diamond -->
      <polygon points="12,-4 6,3 18,3" fill="#e0fbfc"/>
      <polygon points="6,3 9,8 15,8 18,3" fill="#90e0ef"/>
      <line x1="9" y1="3" x2="9" y2="8" stroke="#caf0f8" stroke-width="1"/>
      <line x1="15" y1="3" x2="15" y2="8" stroke="#caf0f8" stroke-width="1"/>
      <!-- Sparkle cross on diamond -->
      <path d="M 12,-10 L 12,2 M 6,-4 L 18,-4" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Character 2: Standing Bestie (Overjoyed / Dramatic Gasp, hands on cheeks) -->
  <g filter="url(#coupleShadow)">
    <!-- Legs -->
    <rect x="220" y="195" width="10" height="42" rx="5" fill="#ffe0bd"/>
    <rect x="240" y="195" width="10" height="42" rx="5" fill="#ffe0bd"/>
    <!-- Cute Pink Shoes -->
    <ellipse cx="225" cy="242" rx="10" ry="5" fill="#ff4d6d"/>
    <ellipse cx="245" cy="242" rx="10" ry="5" fill="#ff4d6d"/>

    <!-- Dress with frill -->
    <path d="M 220,135 L 245,135 L 265,195 L 205,195 Z" fill="url(#dressStanding)"/>
    <circle cx="235" cy="195" r="4" fill="#ffffff"/>
    <circle cx="215" cy="195" r="4" fill="#ffffff"/>
    <circle cx="255" cy="195" r="4" fill="#ffffff"/>

    <!-- Head & Hair -->
    <circle cx="235" cy="95" r="32" fill="#ffe0bd"/>
    <!-- Long Flowing Hair with bow -->
    <path d="M 205,80 C 215,60 255,60 265,80 C 275,105 272,160 265,175 C 260,175 255,145 255,120 C 245,75 220,75 212,120 C 212,145 208,175 202,175 C 195,160 195,105 205,80 Z" fill="url(#hairBlonde)"/>
    <!-- Cute Hair Ribbon / Bow -->
    <ellipse cx="235" cy="62" rx="8" ry="5" fill="#ff4d6d"/>
    <path d="M 235,62 C 220,55 215,70 230,68 Z" fill="#ff758f"/>
    <path d="M 235,62 C 250,55 255,70 240,68 Z" fill="#ff758f"/>

    <!-- Face Details (Gasping with Joy) -->
    <!-- Big Anime Eyes with Stars -->
    <circle cx="224" cy="92" r="6" fill="#2a1408"/>
    <circle cx="223" cy="90" r="2.5" fill="#ffffff"/>
    <circle cx="246" cy="92" r="6" fill="#2a1408"/>
    <circle cx="245" cy="90" r="2.5" fill="#ffffff"/>
    <!-- Rosy Happy Cheeks -->
    <ellipse cx="218" cy="103" rx="8" ry="5" fill="#ff4d6d" opacity="0.6"/>
    <ellipse cx="252" cy="103" rx="8" ry="5" fill="#ff4d6d" opacity="0.6"/>
    <!-- Cute 'O' mouth gasp -->
    <ellipse cx="235" cy="105" rx="5" ry="7" fill="#c9184a"/>
    <ellipse cx="235" cy="107" rx="3" ry="3" fill="#ff758f"/>

    <!-- Hands on Cheeks (Classic gasp pose) -->
    <circle cx="212" cy="104" r="7" fill="#ffe0bd"/>
    <circle cx="258" cy="104" r="7" fill="#ffe0bd"/>
  </g>

  <!-- Romantic/Comedic Floating Hearts & Sparkles -->
  <g>
    <!-- Big Floating Heart in Center -->
    <path d="M 165,55 C 158,40 135,42 140,62 C 145,82 165,95 165,95 C 165,95 185,82 190,62 C 195,42 172,40 165,55 Z" fill="#ff4d6d"/>
    <!-- Mini hearts -->
    <path d="M 130,30 C 126,20 110,22 113,34 C 117,46 130,54 130,54 C 130,54 143,46 147,34 C 150,22 134,20 130,30 Z" fill="#ff758f" transform="scale(0.7) translate(40, -10)"/>
    <path d="M 210,35 C 206,25 190,27 193,39 C 197,51 210,59 210,59 C 210,59 223,51 227,39 C 230,27 214,25 210,35 Z" fill="#ff758f" transform="scale(0.6) translate(140, 0)"/>

    <!-- Golden Stars -->
    <polygon points="180,15 183,23 191,24 185,30 187,38 180,34 173,38 175,30 169,24 177,23" fill="#ffd166"/>
    <polygon points="50,65 53,71 59,72 54,77 56,83 50,80 44,83 46,77 41,72 47,71" fill="#ffd166"/>
    <polygon points="290,75 292,80 297,81 293,85 294,90 290,87 286,90 287,85 283,81 288,80" fill="#ffd166"/>
  </g>
</svg>
