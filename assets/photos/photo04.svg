<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9a9e"/>
      <stop offset="50%" stop-color="#fecfef"/>
      <stop offset="100%" stop-color="#a1c4fd"/>
    </linearGradient>
  </defs>
  <rect width="500" height="500" rx="20" fill="url(#bg4)"/>
  
  <!-- Sunglasses & Sunset Vibes -->
  <g transform="translate(130, 110)">
    <!-- Retro Heart Sunglasses Pair 1 -->
    <path d="M 40,80 C 20,40 60,30 80,60 C 100,30 140,40 120,80 C 100,120 80,140 80,140 C 80,140 60,120 40,80 Z" fill="#ff0054" stroke="#ffffff" stroke-width="4"/>
    <path d="M 140,80 C 120,40 160,30 180,60 C 200,30 240,40 220,80 C 200,120 180,140 180,140 C 180,140 160,120 140,80 Z" fill="#7209b7" stroke="#ffffff" stroke-width="4"/>
    <!-- Bridge -->
    <line x1="120" y1="70" x2="140" y2="70" stroke="#ffffff" stroke-width="4"/>
  </g>

  <text x="250" y="375" font-family="'Caveat', cursive, sans-serif" font-size="32" font-weight="bold" fill="#3a0ca3" text-anchor="middle">“Suspiciously looking like lovers for the plot”</text>
  <text x="250" y="415" font-family="'Outfit', sans-serif" font-size="16" fill="#4361ee" opacity="0.9" text-anchor="middle">THE DRAMATIC PHOTO-DUMP • GOLDEN HOUR</text>
</svg>
