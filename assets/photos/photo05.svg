<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
  </defs>
  <rect width="500" height="500" rx="20" fill="url(#bg5)"/>
  
  <!-- Glowing Moon & Night Sky Stars -->
  <circle cx="250" cy="160" r="65" fill="#fdf0d5" filter="drop-shadow(0 0 25px rgba(253, 240, 213, 0.6))"/>
  <circle cx="270" cy="150" r="55" fill="#203a43"/>

  <!-- Twinkling stars -->
  <circle cx="120" cy="100" r="3" fill="#ffffff"/>
  <circle cx="380" cy="90" r="3.5" fill="#ffffff"/>
  <circle cx="100" cy="220" r="2.5" fill="#ffffff"/>
  <circle cx="400" cy="230" r="3" fill="#ffffff"/>

  <text x="250" y="375" font-family="'Caveat', cursive, sans-serif" font-size="32" font-weight="bold" fill="#fdf0d5" text-anchor="middle">“Under the same sky, through every phase”</text>
  <text x="250" y="415" font-family="'Outfit', sans-serif" font-size="16" fill="#a8dadc" opacity="0.9" text-anchor="middle">LATE NIGHT CAR TALKS • 3:00 AM</text>
</svg>
