<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffccd5"/>
      <stop offset="50%" stop-color="#ffb3c6"/>
      <stop offset="100%" stop-color="#f8edeb"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="20" fill="url(#bg1)"/>
  
  <!-- Cafe / Boba drinks scene -->
  <g transform="translate(100, 110)">
    <!-- Boba Cup 1 -->
    <rect x="50" y="80" width="80" height="140" rx="15" fill="#ffffff" opacity="0.9" filter="url(#softShadow)"/>
    <rect x="55" y="110" width="70" height="100" rx="10" fill="#e0a96d" opacity="0.7"/>
    <!-- Pearls -->
    <circle cx="75" cy="185" r="8" fill="#4a2c11"/>
    <circle cx="95" cy="188" r="7" fill="#4a2c11"/>
    <circle cx="108" cy="180" r="8" fill="#4a2c11"/>
    <circle cx="85" cy="170" r="7.5" fill="#4a2c11"/>
    <!-- Straw -->
    <rect x="85" y="40" width="10" height="70" rx="4" fill="#ff758f" transform="rotate(-10 90 75)"/>
    <!-- Heart sticker -->
    <path d="M 90,140 C 85,130 75,130 70,135 C 65,140 70,147 90,160 C 110,147 115,140 110,135 C 105,130 95,130 90,140 Z" fill="#ff4d6d"/>

    <!-- Boba Cup 2 (Matching with bestie) -->
    <rect x="170" y="80" width="80" height="140" rx="15" fill="#ffffff" opacity="0.9" filter="url(#softShadow)"/>
    <rect x="175" y="110" width="70" height="100" rx="10" fill="#c9ada7" opacity="0.7"/>
    <!-- Pearls -->
    <circle cx="195" cy="185" r="8" fill="#4a2c11"/>
    <circle cx="215" cy="188" r="7" fill="#4a2c11"/>
    <circle cx="228" cy="180" r="8" fill="#4a2c11"/>
    <circle cx="205" cy="170" r="7.5" fill="#4a2c11"/>
    <!-- Straw -->
    <rect x="205" y="40" width="10" height="70" rx="4" fill="#8338ec" transform="rotate(10 210 75)"/>
    <!-- Heart sticker -->
    <path d="M 210,140 C 205,130 195,130 190,135 C 185,140 190,147 210,160 C 230,147 235,140 230,135 C 225,130 215,130 210,140 Z" fill="#ff758f"/>
  </g>

  <!-- Cute Text & Sparkles -->
  <text x="250" y="380" font-family="'Caveat', cursive, sans-serif" font-size="32" font-weight="bold" fill="#843b62" text-anchor="middle">“Let's get iced coffee and talk for 5 hours”</text>
  <text x="250" y="415" font-family="'Outfit', sans-serif" font-size="16" fill="#a4133c" opacity="0.8" text-anchor="middle">DAY 01 • OUR FIRST CAFE DATE</text>

  <!-- Sparkles -->
  <circle cx="80" cy="80" r="5" fill="#ffd166"/>
  <circle cx="420" cy="90" r="6" fill="#ffd166"/>
  <circle cx="430" cy="340" r="4" fill="#ff758f"/>
  <circle cx="70" cy="350" r="5" fill="#ff758f"/>
</svg>
