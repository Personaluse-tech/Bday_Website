<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faedcd"/>
      <stop offset="50%" stop-color="#e9edc9"/>
      <stop offset="100%" stop-color="#fefae0"/>
    </linearGradient>
  </defs>
  <rect width="500" height="500" rx="20" fill="url(#bg2)"/>
  
  <!-- Photobooth Strip Graphic -->
  <g transform="translate(180, 50)">
    <rect x="0" y="0" width="140" height="340" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="3" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.1))"/>
    
    <!-- Photo 1: Silly Faces -->
    <rect x="15" y="20" width="110" height="85" rx="4" fill="#ffb4a2"/>
    <circle cx="50" cy="62" r="14" fill="#590d22"/>
    <circle cx="90" cy="62" r="14" fill="#590d22"/>
    <path d="M 40,75 Q 50,88 60,75" stroke="#ffccd5" stroke-width="3" fill="none"/>
    <path d="M 80,75 Q 90,88 100,75" stroke="#ffccd5" stroke-width="3" fill="none"/>

    <!-- Photo 2: Peace Signs -->
    <rect x="15" y="120" width="110" height="85" rx="4" fill="#b5e48c"/>
    <circle cx="50" cy="162" r="14" fill="#1b4332"/>
    <circle cx="90" cy="162" r="14" fill="#1b4332"/>
    <text x="50" y="195" font-size="14" text-anchor="middle">✌️</text>
    <text x="90" y="195" font-size="14" text-anchor="middle">✌️</text>

    <!-- Photo 3: Big Hugs -->
    <rect x="15" y="220" width="110" height="85" rx="4" fill="#ffc6ff"/>
    <circle cx="60" cy="260" r="16" fill="#4a154b"/>
    <circle cx="80" cy="260" r="16" fill="#4a154b"/>
    <text x="70" y="295" font-size="16" text-anchor="middle">🫂💖</text>
  </g>

  <!-- Title & Quote -->
  <text x="250" y="425" font-family="'Caveat', cursive, sans-serif" font-size="30" font-weight="bold" fill="#386641" text-anchor="middle">“Never let us loose in a photo booth again”</text>
  <text x="250" y="460" font-family="'Outfit', sans-serif" font-size="15" fill="#6a994e" text-anchor="middle">MALL PHOTOBOOTH CHAOS • ARCHIVED</text>
</svg>
