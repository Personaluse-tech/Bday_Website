<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" width="100%" height="100%">
  <defs>
    <filter id="hugShad" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#4a1525" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="bearBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff5f5"/>
      <stop offset="50%" stop-color="#fed7e2"/>
      <stop offset="100%" stop-color="#fbb6ce"/>
    </linearGradient>
    <linearGradient id="earInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7d7"/>
      <stop offset="100%" stop-color="#f687b3"/>
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="130" cy="240" rx="70" ry="12" fill="#2b1b22" opacity="0.12"/>

  <!-- Feet -->
  <ellipse cx="100" cy="232" rx="18" ry="10" fill="#f687b3"/>
  <ellipse cx="160" cy="232" rx="18" ry="10" fill="#f687b3"/>

  <!-- Fluffy Bear Mascot with Open Arms -->
  <g filter="url(#hugShad)">
    <!-- Ears -->
    <circle cx="80" cy="70" r="22" fill="#fed7e2"/>
    <circle cx="80" cy="70" r="14" fill="url(#earInner)"/>
    <circle cx="180" cy="70" r="22" fill="#fed7e2"/>
    <circle cx="180" cy="70" r="14" fill="url(#earInner)"/>

    <!-- Left Arm Spread Open Wide -->
    <path d="M 95,140 C 60,130 25,120 18,140 C 15,155 35,175 75,170 C 95,168 100,155 95,140 Z" fill="#fed7e2"/>
    <!-- Left Paw Pad -->
    <ellipse cx="28" cy="145" rx="8" ry="6" fill="#f687b3" transform="rotate(-15 28 145)"/>

    <!-- Right Arm Spread Open Wide -->
    <path d="M 165,140 C 200,130 235,120 242,140 C 245,155 225,175 185,170 C 165,168 160,155 165,140 Z" fill="#fed7e2"/>
    <!-- Right Paw Pad -->
    <ellipse cx="232" cy="145" rx="8" ry="6" fill="#f687b3" transform="rotate(15 232 145)"/>

    <!-- Round Chubby Body -->
    <ellipse cx="130" cy="165" rx="65" ry="65" fill="url(#bearBodyGrad)"/>

    <!-- Soft Tummy Patch -->
    <ellipse cx="130" cy="175" rx="42" ry="42" fill="#ffffff" opacity="0.8"/>
    <!-- Heart outline on tummy -->
    <path d="M 130,165 C 124,152 105,155 110,170 C 114,185 130,195 130,195 C 130,195 146,185 150,170 C 155,155 136,152 130,165 Z" fill="#ff758f" opacity="0.5"/>

    <!-- Head -->
    <circle cx="130" cy="105" rx="55" ry="50" fill="url(#bearBodyGrad)"/>

    <!-- Cute Eyes with Sparkles -->
    <!-- Left Eye -->
    <circle cx="110" cy="100" r="7" fill="#2b1b22"/>
    <circle cx="108" cy="98" r="2.5" fill="#ffffff"/>
    <circle cx="112" cy="102" r="1.2" fill="#ffffff"/>

    <!-- Right Eye -->
    <circle cx="150" cy="100" r="7" fill="#2b1b22"/>
    <circle cx="148" cy="98" r="2.5" fill="#ffffff"/>
    <circle cx="152" cy="102" r="1.2" fill="#ffffff"/>

    <!-- Snout & Nose -->
    <ellipse cx="130" cy="115" rx="16" ry="12" fill="#ffffff"/>
    <ellipse cx="130" cy="110" rx="6" ry="4.5" fill="#4a1525"/>
    <!-- Happy Smile -->
    <path d="M 125,116 Q 130,122 135,116" stroke="#4a1525" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Rosy Cheeks -->
    <ellipse cx="96" cy="112" rx="9" ry="5.5" fill="#ff4d6d" opacity="0.6"/>
    <ellipse cx="164" cy="112" rx="9" ry="5.5" fill="#ff4d6d" opacity="0.6"/>
  </g>

  <!-- Floating Gentle Hearts Above Arms -->
  <path d="M 45,95 C 40,82 20,85 25,100 C 30,115 45,125 45,125 C 45,125 60,115 65,100 C 70,85 50,82 45,95 Z" fill="#ff758f" transform="scale(0.5) translate(40, 50)"/>
  <path d="M 215,95 C 210,82 190,85 195,100 C 200,115 215,125 215,125 C 215,125 230,115 235,100 C 240,85 220,82 215,95 Z" fill="#ff758f" transform="scale(0.5) translate(220, 50)"/>
  <circle cx="130" cy="35" r="4" fill="#ffd166"/>
</svg>
