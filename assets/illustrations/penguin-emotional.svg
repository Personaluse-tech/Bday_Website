<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" width="100%" height="100%">
  <defs>
    <filter id="softShadE" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#3c096c" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="bodyGradEmo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a5568"/>
      <stop offset="60%" stop-color="#2d3748"/>
      <stop offset="100%" stop-color="#1a202c"/>
    </linearGradient>
    <linearGradient id="tummyGradEmo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#edf2f7"/>
    </linearGradient>
    <linearGradient id="beakGradE" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbd38d"/>
      <stop offset="100%" stop-color="#dd6b20"/>
    </linearGradient>
    <linearGradient id="mugGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7d7"/>
      <stop offset="100%" stop-color="#feb2b2"/>
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="120" cy="242" rx="65" ry="12" fill="#2b1b22" opacity="0.15"/>

  <!-- Feet (tucked in cozy) -->
  <ellipse cx="98" cy="235" rx="16" ry="9" fill="url(#beakGradE)"/>
  <ellipse cx="142" cy="235" rx="16" ry="9" fill="url(#beakGradE)"/>

  <!-- Main Body -->
  <g filter="url(#softShadE)">
    <!-- Outer Body -->
    <path d="M 120,40 C 65,40 50,90 50,150 C 50,210 75,235 120,235 C 165,235 190,210 190,150 C 190,90 175,40 120,40 Z" fill="url(#bodyGradEmo)"/>

    <!-- Left Wing -->
    <path d="M 52,130 C 35,145 35,175 45,190 C 55,180 58,160 58,140 Z" fill="#2d3748"/>
    <!-- Right Wing -->
    <path d="M 188,130 C 205,145 205,175 195,190 C 185,180 182,160 182,140 Z" fill="#2d3748"/>

    <!-- White Tummy -->
    <path d="M 120,80 C 85,80 72,115 72,160 C 72,205 90,225 120,225 C 150,225 168,205 168,160 C 168,115 155,80 120,80 Z" fill="url(#tummyGradEmo)"/>

    <!-- Emotional / Teary Shiny Eyes -->
    <!-- Left Eye -->
    <circle cx="96" cy="108" r="11" fill="#1a202c"/>
    <ellipse cx="94" cy="104" rx="4.5" ry="5.5" fill="#ffffff"/>
    <circle cx="98" cy="113" r="2.5" fill="#ffffff"/>
    <circle cx="102" cy="107" r="1.5" fill="#ffffff"/>

    <!-- Right Eye -->
    <circle cx="144" cy="108" r="11" fill="#1a202c"/>
    <ellipse cx="142" cy="104" rx="4.5" ry="5.5" fill="#ffffff"/>
    <circle cx="146" cy="113" r="2.5" fill="#ffffff"/>
    <circle cx="150" cy="107" r="1.5" fill="#ffffff"/>

    <!-- Shy Cute Beak -->
    <path d="M 115,116 Q 120,125 125,116 Q 120,113 115,116 Z" fill="url(#beakGradE)"/>

    <!-- Deep Warm Blush (cute anime style with lines) -->
    <ellipse cx="85" cy="122" rx="12" ry="7" fill="#feb2b2" opacity="0.7"/>
    <ellipse cx="155" cy="122" rx="12" ry="7" fill="#feb2b2" opacity="0.7"/>
    <line x1="80" y1="120" x2="84" y2="125" stroke="#f56565" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="86" y1="120" x2="90" y2="125" stroke="#f56565" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="150" y1="120" x2="154" y2="125" stroke="#f56565" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="156" y1="120" x2="160" y2="125" stroke="#f56565" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Cozy Knitted Scarf around Neck -->
    <!-- Scarf loop around neck -->
    <path d="M 68,130 C 68,130 90,142 120,142 C 150,142 172,130 172,130 C 176,145 152,156 120,156 C 88,156 64,145 68,130 Z" fill="#e53e3e"/>
    <!-- Scarf Stripes -->
    <path d="M 82,135 L 86,151" stroke="#feb2b2" stroke-width="4" stroke-linecap="round"/>
    <path d="M 104,138 L 106,155" stroke="#feb2b2" stroke-width="4" stroke-linecap="round"/>
    <path d="M 134,138 L 132,155" stroke="#feb2b2" stroke-width="4" stroke-linecap="round"/>
    <path d="M 156,135 L 152,151" stroke="#feb2b2" stroke-width="4" stroke-linecap="round"/>

    <!-- Hanging Scarf Tail -->
    <path d="M 136,150 L 146,192 C 146,195 130,198 126,194 L 122,152 Z" fill="#e53e3e"/>
    <line x1="130" y1="165" x2="140" y2="165" stroke="#feb2b2" stroke-width="3.5"/>
    <line x1="128" y1="178" x2="143" y2="178" stroke="#feb2b2" stroke-width="3.5"/>
    <!-- Fringe at bottom of tail -->
    <line x1="128" y1="194" x2="128" y2="200" stroke="#9b2c2c" stroke-width="2"/>
    <line x1="133" y1="195" x2="133" y2="201" stroke="#9b2c2c" stroke-width="2"/>
    <line x1="138" y1="194" x2="138" y2="200" stroke="#9b2c2c" stroke-width="2"/>
    <line x1="143" y1="193" x2="143" y2="199" stroke="#9b2c2c" stroke-width="2"/>

    <!-- Holding Tiny Warm Cocoa Mug -->
    <g transform="translate(100, 168)">
      <!-- Mug -->
      <rect x="0" y="8" width="28" height="26" rx="6" fill="url(#mugGrad)"/>
      <ellipse cx="14" cy="8" rx="14" ry="4" fill="#7b341e"/>
      <!-- Mug Handle -->
      <path d="M 28,12 C 36,12 36,26 28,26" stroke="#feb2b2" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <!-- Heart on Mug -->
      <path d="M 14,16 C 11,13 8,15 9,18 C 10,21 14,24 14,24 C 14,24 18,21 19,18 C 20,15 17,13 14,16 Z" fill="#e53e3e"/>
      <!-- Little Steam rising with tiny heart -->
      <path d="M 10,2 Q 8,-6 11,-12" stroke="#cbd5e0" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
      <path d="M 18,3 Q 21,-5 17,-11" stroke="#cbd5e0" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
    </g>

    <!-- Flipper paws holding mug -->
    <ellipse cx="98" cy="182" rx="8" ry="10" fill="#2d3748" transform="rotate(20 98 182)"/>
    <ellipse cx="132" cy="182" rx="8" ry="10" fill="#2d3748" transform="rotate(-20 132 182)"/>
  </g>

  <!-- Gentle Emotional Sparkles -->
  <circle cx="58" cy="65" r="3" fill="#cbd5e0" opacity="0.8"/>
  <circle cx="182" cy="70" r="3.5" fill="#cbd5e0" opacity="0.8"/>
  <path d="M 195,95 Q 200,95 200,90 Q 200,95 205,95 Q 200,95 200,100 Q 200,95 195,95 Z" fill="#ffd166"/>
</svg>
