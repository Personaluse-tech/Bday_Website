<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="100%" height="100%">
  <defs>
    <linearGradient id="boxGradO" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9ebb"/>
      <stop offset="50%" stop-color="#ff758f"/>
      <stop offset="100%" stop-color="#c9184a"/>
    </linearGradient>
    <linearGradient id="lidGradO" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb3c6"/>
      <stop offset="100%" stop-color="#ff8fab"/>
    </linearGradient>
    <linearGradient id="ribbonGradO" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe6a7"/>
      <stop offset="50%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#e9a200"/>
    </linearGradient>
    <radialGradient id="burstGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#ff758f" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffccd5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="140" cy="255" rx="95" ry="14" fill="#4a1525" opacity="0.15"/>

  <!-- Magical Glow Burst from Inside -->
  <circle cx="140" cy="140" r="85" fill="url(#burstGlow)"/>

  <!-- Flying Hearts, Stars, & Confetti -->
  <g>
    <!-- Big Heart Center -->
    <path d="M 140,55 C 130,25 90,30 95,65 C 100,95 140,115 140,115 C 140,115 180,95 185,65 C 190,30 150,25 140,55 Z" fill="#ff4d6d">
      <animate attributeName="transform" type="translate" values="0,0; 0,-8; 0,0" dur="2s" repeatCount="indefinite"/>
    </path>

    <!-- Small Hearts Floating -->
    <path d="M 80,75 C 74,55 50,60 55,80 C 60,100 80,112 80,112 C 80,112 100,100 105,80 C 110,60 86,55 80,75 Z" fill="#ff758f" transform="scale(0.65) translate(40, -10)"/>
    <path d="M 200,75 C 194,55 170,60 175,80 C 180,100 200,112 200,112 C 200,112 220,100 225,80 C 230,60 206,55 200,75 Z" fill="#ff758f" transform="scale(0.65) translate(140, -20)"/>
    
    <!-- Stars -->
    <polygon points="50,45 54,55 64,56 56,63 59,73 50,67 41,73 44,63 36,56 46,55" fill="#ffd166"/>
    <polygon points="225,40 229,50 239,51 231,58 234,68 225,62 216,68 219,58 211,51 221,50" fill="#ffd166"/>
    <polygon points="140,15 143,24 152,25 145,31 147,40 140,35 133,40 135,31 128,25 137,24" fill="#ffd166"/>

    <!-- Confetti strips -->
    <rect x="65" y="100" width="8" height="18" rx="3" fill="#70d6ff" transform="rotate(35 69 109)"/>
    <rect x="210" y="95" width="8" height="18" rx="3" fill="#06d6a0" transform="rotate(-40 214 104)"/>
    <rect x="105" y="35" width="6" height="16" rx="2" fill="#ffbe0b" transform="rotate(-15 108 43)"/>
    <rect x="175" y="30" width="6" height="16" rx="2" fill="#c77dff" transform="rotate(25 178 38)"/>
  </g>

  <!-- Open Box Body -->
  <g>
    <!-- Interior Dark Opening -->
    <ellipse cx="140" cy="140" rx="75" ry="22" fill="#38040e"/>

    <!-- Box Front & Sides -->
    <path d="M 55,140 L 55,235 C 55,243 62,250 70,250 L 210,250 C 218,250 225,243 225,235 L 225,140 C 225,140 195,152 140,152 C 85,152 55,140 55,140 Z" fill="url(#boxGradO)"/>

    <!-- Front Vertical Ribbon -->
    <path d="M 124,152 L 124,250 L 156,250 L 156,152 Z" fill="url(#ribbonGradO)"/>
  </g>

  <!-- Popped Open Box Lid (Tilted to the side) -->
  <g transform="translate(195, 125) rotate(32)">
    <rect x="-80" y="-18" width="160" height="32" rx="9" fill="url(#lidGradO)" stroke="#ff4d6d" stroke-width="1.5"/>
    <rect x="-16" y="-18" width="32" height="32" fill="url(#ribbonGradO)"/>
    <!-- Bow Loops on Tilted Lid -->
    <ellipse cx="-18" cy="-26" rx="18" ry="12" fill="url(#ribbonGradO)"/>
    <ellipse cx="18" cy="-26" rx="18" ry="12" fill="url(#ribbonGradO)"/>
    <circle cx="0" cy="-22" r="9" fill="#ffd166"/>
  </g>
</svg>
